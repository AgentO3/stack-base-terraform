# Single hook runner for this repository (ADR-009, prek rule 16).
# Install once with: prek install --prepare-hooks && prek install --hook-type commit-msg

default_stages = ["pre-commit"]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v4.6.0"

[[repos.hooks]]
id = "trailing-whitespace"

[[repos.hooks]]
id = "end-of-file-fixer"

[[repos.hooks]]
id = "check-yaml"
files = '\.(ya?ml)$'

[[repos.hooks]]
id = "check-json"
files = '\.json$'

[[repos.hooks]]
id = "check-merge-conflict"

[[repos.hooks]]
id = "check-added-large-files"
args = ["--maxkb=1024"]

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.18.4"

[[repos.hooks]]
id = "gitleaks"

[[repos]]
repo = "https://github.com/antonbabenko/pre-commit-terraform"
rev = "v1.92.0"

[[repos.hooks]]
id = "terraform_fmt"
files = '\.tf$'

[[repos.hooks]]
id = "terraform_validate"
files = '\.tf$'
args = ["--retry-on-error"]

[[repos.hooks]]
id = "terraform_checkov"
files = '\.tf$'
stages = ["manual"]

[[repos]]
repo = "https://github.com/shellcheck-py/shellcheck-py"
rev = "v0.10.0.1"

[[repos.hooks]]
id = "shellcheck"
files = '^verify/.*\.sh$'

[[repos]]
repo = "https://github.com/alessandrojcm/commitlint-pre-commit-hook"
rev = "v9.18.0"

[[repos.hooks]]
id = "commitlint"
stages = ["commit-msg"]
